            return React.createElement('span', { className: `px-3 py-1 text-sm font-bold rounded-full ${statusStyles[status]}`}, statusText[status]);

        return React.createElement('div', { className: "max-w-2xl mx-auto glass-ui p-8" },
            React.createElement('div', { className: "flex flex-col sm:flex-row gap-3" },
                React.createElement('input', { type: "text", value: trackingCode, onChange: (e) => setTrackingCode(e.target.value), className: "w-full p-4 text-center font-bold font-numbers text-gray-100 bg-gray-700/50 rounded-lg border-2 border-gray-600", placeholder: "أدخل كود التتبع هنا (e.g., MS-1024)" }),
                React.createElement('button', { onClick: handleTrack, className: "px-8 py-4 rounded-lg font-bold bg-gradient-to-r from-teal-400 to-green-500 text-white" }, "تتبع")
            ),
            error && React.createElement('p', { className: "mt-4 text-center text-red-500 font-bold" }, error),
            foundOrder && React.createElement('div', { className: "mt-6 p-4 bg-gray-900/50 rounded-lg fade-in" },
                React.createElement('div', { className: "flex justify-between items-center" },
                    React.createElement('p', null, React.createElement('span', { className: "text-gray-400" }, "الحالة:")),
                    React.createElement(StatusBadge, { status: foundOrder.status })
                ),
                React.createElement('div', { className: "mt-2 flex justify-between items-center" },
                    React.createElement('p', null, React.createElement('span', { className: "text-gray-400" }, "المبلغ: ")),
                    React.createElement('p', { className: "font-bold font-numbers text-gray-100" }, `${foundOrder.amount.toLocaleString()} ${foundOrder.fromCurrency}`)
                )
            )
        );
    };

    const FinanceInsight = ({ rates }) => {
        const [isLoading, setIsLoading] = useState(false);
        const [analysis, setAnalysis] = useState('');
        const [error, setError] = useState('');

        const handleFetchAnalysis = async () => {
            setIsLoading(true); setAnalysis(''); setError('');
            try {
                const result = await getMarketAnalysis(rates);
                setAnalysis(result);
            } catch (err) {
                setError(err.message || 'An unknown error occurred.');
            } finally {
                setIsLoading(false);
            }
        };

        const LoadingSpinner = () => React.createElement('div', { className: "animate-spin rounded-full h-8 w-8 border-b-2 border-green-400 mx-auto" });

        return React.createElement('div', { className: "p-6 rounded-2xl glass-ui text-center" },
            React.createElement('button', { onClick: handleFetchAnalysis, disabled: isLoading, className: "px-6 py-3 rounded-lg font-bold bg-gradient-to-r from-teal-400 to-green-500 text-white disabled:opacity-50" }, isLoading ? '...جاري التحليل' : 'احصل على تحليل للسوق'),
            isLoading && React.createElement('div', {className: "py-4"}, React.createElement(LoadingSpinner)),
            error && React.createElement('p', { className: "mt-4 text-red-500" }, error),
            analysis && React.createElement('p', { className: "mt-4 text-gray-300 text-right whitespace-pre-wrap leading-relaxed" }, analysis)
        );
    };
    
    const WhatsAppButton = () => {
        const message = `مرحباً ${BUSINESS_NAME}، أرغب في الاستفسار عن خدمة الصرافة.`;
        const whatsappLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
        return React.createElement('a', { href: whatsappLink, target: "_blank", rel: "noopener noreferrer", className: "fixed bottom-6 left-6 z-50 bg-green-500 text-white w-16 h-16 rounded-full flex items-center justify-center shadow-lg animate-fab-pulse" },
            React.createElement('svg', { className: "w-8 h-8", fill: "currentColor", viewBox: "0 0 24 24" }, React.createElement('path', { d: "M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.487 5.235 3.487 8.413 0 6.557-5.338 11.892-11.894 11.892-1.99 0-3.902-.539-5.587-1.528l-6.191 1.645v-.001zM7.59 17.556c.227.357.656.556 1.054.619.41.064.819.096 1.24.096 4.83 0 8.758-3.928 8.758-8.758 0-4.829-3.928-8.758-8.758-8.758-4.829 0-8.758 3.929-8.758 8.758.001 1.95.633 3.822 1.745 5.333l.25.374-1.143 4.156 4.25-1.119.355.233z" }))
        );
    };

    // --- MAIN APP COMPONENT ---
    const App = () => {
        const [rates, setRates] = useState(INITIAL_RATES);
        const [orders, setOrders] = useState(() => {
          try {
            const stored = localStorage.getItem('moneyShopOrders');
            return stored ? JSON.parse(stored) : mockOrders;
          } catch { return mockOrders; }
        });

        useEffect(() => { localStorage.setItem('moneyShopOrders', JSON.stringify(orders)); }, [orders]);
        
        useEffect(() => {
            const interval = setInterval(() => {
                setRates(prev => prev.map(r => ({...r, buy: parseFloat((r.buy * (1+(Math.random()-0.5)*0.001)).toFixed(2)), sell: parseFloat((r.sell * (1+(Math.random()-0.5)*0.001)).toFixed(2)) })));
            }, 5000);
            return () => clearInterval(interval);
        }, []);

        const addOrder = (order) => setOrders(prev => [order, ...prev]);

        return React.createElement('div', { className: "min-h-screen flex flex-col" },
            React.createElement('header', { className: "sticky top-0 z-40 p-4 bg-gray-900/80 backdrop-blur-lg border-b border-gray-700/60" }, 
                React.createElement('div', { className: "max-w-7xl mx-auto flex justify-between items-center" },
                    React.createElement('h1', {className:"text-white text-2xl font-bold"}, "MoneyShop"),
                    React.createElement('nav', { className: "hidden md:flex gap-6 items-center" },
                        React.createElement('a', {href: "#rates", className: "text-gray-300 hover:text-white transition"}, "الأسعار"),
                        React.createElement('a', {href: "#how-it-works", className: "text-gray-300 hover:text-white transition"}, "كيف نعمل"),
                        React.createElement('a', {href: "#track-transfer", className: "text-gray-300 hover:text-white transition"}, "تتبع حوالتك")
                    )
                )
            ),
            React.createElement('main', { className: "flex-grow" },
                React.createElement('section', { id: "hero", className: "text-center py-28" },
                    React.createElement('h1', { className: "text-4xl lg:text-6xl font-[900] text-gray-50" }, "ارسل الأموال بأمان وموثوقية"),
                    React.createElement('p', { className: "text-lg text-gray-400 mt-4" }, "بأفضل سعر صرف في السوق."),
                     React.createElement('a', { href: "#send-request", className: "mt-8 inline-block px-8 py-4 rounded-xl text-lg font-bold bg-gradient-to-r from-teal-400 to-green-500 text-white" }, "ابدأ الآن")
                ),
                React.createElement('section', { id: "rates", className: "py-20" },
                    React.createElement('div', { className: "max-w-7xl mx-auto px-4" },
                        React.createElement('h2', { className: "text-3xl font-bold text-white text-center mb-12" }, "أسعار الصرف اليومية"),
                        React.createElement(ExchangeBoard, { rates })
                    )
                ),
                React.createElement('section', { id: "how-it-works" }, React.createElement(HowItWorks)),
                React.createElement('section', { id: "send-request", className: "py-20" },
                    React.createElement('div', { className: "max-w-7xl mx-auto px-4" },
                        React.createElement('h2', { className: "text-3xl font-bold text-white text-center mb-12" }, "أرسل طلبك الآن"),
                        React.createElement('div', { className: "max-w-2xl mx-auto" }, React.createElement(CurrencyConverter, { rates, onAddOrder: addOrder }))
                    )
                ),
                React.createElement('section', { id: "track-transfer", className: "py-20" },
                    React.createElement('div', { className: "max-w-7xl mx-auto px-4" },
                        React.createElement('h2', { className: "text-3xl font-bold text-white text-center mb-12" }, "تتبع حوالتك"),
                        React.createElement(TrackTransfer, { orders })
                    )
                ),
                React.createElement('section', { id: "ai-analysis", className: "py-20" },
                    React.createElement('div', { className: "max-w-4xl mx-auto px-4" },
                        React.createElement('h2', { className: "text-3xl font-bold text-white text-center mb-12" }, "تحليل السوق بالذكاء الاصطناعي"),
                        React.createElement(FinanceInsight, { rates })
                    )
                )
            ),
            React.createElement('footer', { className: "text-center text-gray-400 py-8 border-t border-gray-800" }, `© ${new Date().getFullYear()} MoneyShop Exchange. جميع الحقوق محفوظة.`),
            React.createElement(WhatsAppButton)
        );
    };

    // --- RENDER LOGIC ---
    const container = document.getElementById('root');
    if (container) {
      const root = createRoot(container);
      root.render(React.createElement(App));
    }
  </script>
</body>
</html>
